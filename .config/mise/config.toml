# Tap formulae can't be installed by mise directly: mise fetches bottle metadata
# from the tap's GitHub raw `api/formula/<name>.json` and never shells out to brew.
# NONE of the taps below publish that metadata (verified 404 on every formula as of
# 2026-08), so each one MUST stay here in the hook via real `brew`.
#
# MIGRATION when a tap starts publishing metadata:
#   1. Check:  curl -fsI https://raw.githubusercontent.com/<owner>/<repo>/<branch>/api/formula/<name>.json
#              -> HTTP 200 means it can now be installed declaratively.
#   2. If 200: move the formula into [bootstrap.packages] as
#                 "brew:<owner>/<tap>/<formula>" = "latest"
#              and DELETE its `brew list ... || brew install ...` line here.
#   3. Keep the `brew trust`/`brew tap` lines only while any formula still needs them.
[bootstrap.hooks.post-packages]
run = """
set -e
# macOS-only tap formulae: only run on Darwin; skipped on other platforms.
MACOS_ONLY_TAPS="sichengchen/tap/apple-calendar-cli steipete/tap/imsg steipete/tap/peekaboo steipete/tap/remindctl cirruslabs/cli/tart"
# Cross-platform tap formulae: run on all platforms.
ALL_OS_TAPS="steipete/tap/gifgrep gittower/tap/git-flow-next antoniorodr/memo/memo anomalyco/tap/opencode"
# Helper: install a tap formula WITHOUT aborting the whole hook on failure, so a
# single broken/flaky tap formula (e.g. memo) can't block oh-my-zsh / dotfiles/stow.
tap_install() {
  local formula="$1"
  if brew list "$formula" &>/dev/null; then
    echo "TAP present: $formula"
    return 0
  fi
  if brew install "$formula"; then
    echo "TAP installed: $formula"
  else
    echo "TAP FAILED (continuing): $formula"
    return 0
  fi
}
# Trust third-party taps (brew 6.x tap-trust requirement)
brew trust sichengchen/tap steipete/tap gittower/tap antoniorodr/memo anomalyco/tap cirruslabs/cli 2>/dev/null || true
# Ensure taps are present
brew tap sichengchen/tap 2>/dev/null || true
brew tap steipete/tap 2>/dev/null || true
brew tap gittower/tap 2>/dev/null || true
brew tap antoniorodr/memo 2>/dev/null || true
brew tap anomalyco/tap 2>/dev/null || true
brew tap cirruslabs/cli 2>/dev/null || true
# Install cross-platform tap formulae
for formula in $ALL_OS_TAPS; do
  tap_install "$formula"
done
# Install macOS-only tap formulae (skip non-macOS platforms; skip ones needing full Xcode.app when absent)
if [ "$(uname)" = "Darwin" ]; then
  tap_install sichengchen/tap/apple-calendar-cli || { [ -d /Applications/Xcode.app ] && tap_install sichengchen/tap/apple-calendar-cli || echo "SKIP apple-calendar-cli (needs Xcode.app)"; }
  for formula in steipete/tap/imsg steipete/tap/peekaboo steipete/tap/remindctl cirruslabs/cli/tart; do
    tap_install "$formula"
  done
else
  echo "SKIP macOS-only tap formulae (on Linux)"
fi

# Install Oh My Zsh via the official installer — OS-specific download tool
# (curl on macOS, wget on Linux). Idempotent: skip if already installed.
if [ ! -d "${ZSH:-$HOME/.oh-my-zsh}" ]; then
  OHMYZSH_URL="https://raw.githubusercontent.com/ohmyzsh/ohmyzsh/master/tools/install.sh"
  if [ "$(uname)" = "Darwin" ]; then
    sh -c "$(curl -fsSL "$OHMYZSH_URL")" "" --keep-zshrc --unattended
  else
    sh -c "$(wget "$OHMYZSH_URL" -O -)" "" --keep-zshrc --unattended
  fi
else
  echo "oh-my-zsh already installed (skipping)"
fi

# === Deploy dotfiles repo via stow (overwrites autogenerated configs) ===
# Clone the public dotfiles repo over HTTPS (no SSH keys needed on a fresh
# machine), then `stow .` to symlink every managed file into $HOME. Any plain,
# non-symlink target that conflicts is DELETED first so the managed symlink wins
# ("my dotfiles override autogenerated defaults"). Conflict targets are parsed
# from stow's own conflict report, so nested conflicts (.config/*, .local/*) are
# caught too — not just top-level files.
# After cloning, the remote is switched to SSH so future `git push` uses the key
# in ~/.ssh instead of prompting for HTTPS credentials.
DOTFILES_REPO_URL="https://github.com/zeromask1337/.dotfiles.git"
DOTFILES_SSH_URL="git@github.com:zeromask1337/.dotfiles.git"
if [ ! -d "$HOME/.dotfiles/.git" ]; then
  git clone "$DOTFILES_REPO_URL" "$HOME/.dotfiles"
else
  git -C "$HOME/.dotfiles" fetch --unshallow origin master && git -C "$HOME/.dotfiles" reset --hard origin/master
fi
git -C "$HOME/.dotfiles" remote set-url origin "$DOTFILES_SSH_URL"
# Alert if there are no SSH keys yet: pushes will fail until one is generated
# and added to GitHub (e.g. `ssh-keygen -t ed25519 -f ~/.ssh/github`).
if [ ! -f "$HOME/.ssh/github" ] && [ -z "$(ls -A "$HOME/.ssh" 2>/dev/null)" ]; then
  echo "WARN: ~/.ssh is empty - generate a key and add it to GitHub: ssh-keygen -t ed25519 -f ~/.ssh/github && gh ssh-key add ~/.ssh/github.pub"
fi
cd "$HOME/.dotfiles"
if stow . 2>/tmp/stow.err; then
  echo "stow: all dotfiles linked (no conflicts)"
else
  echo "stow had conflicts; removing plain files that block managed symlinks, then retrying..."
  grep -o 'over existing target [^ ]*' /tmp/stow.err | sed 's/over existing target //' | sort -u | while read -r rel; do
    target="$HOME/$rel"
    if [ -e "$target" ] && [ ! -L "$target" ]; then
      echo "  removing autogenerated: $target"
      rm -rf "$target"
    fi
  done
  stow . || echo "WARN stow still reported failures after conflict removal"
fi
rm -f /tmp/stow.err

# === Install lefthook git hooks for the dotfiles repo ===
# lefthook.yml lives in the dotfiles repo; `lefthook install` wires its hooks
# (e.g. commit-msg inject-scope) into .git/hooks. Idempotent and non-fatal.
if command -v lefthook >/dev/null 2>&1; then
  if (cd "$HOME/.dotfiles" && lefthook install 2>/tmp/lefthook.err); then
    echo "lefthook: hooks installed"
  else
    echo "WARN lefthook install failed (continuing): $(cat /tmp/lefthook.err)"
  fi
  rm -f /tmp/lefthook.err
else
  echo "SKIP lefthook install (lefthook not found)"
fi

echo TAP_PACKAGES_HOOK_DONE
"""
