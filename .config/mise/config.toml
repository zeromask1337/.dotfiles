[tools]
node = { version = "latest", auto_update = true }
pnpm = "latest"
rust = { version = "stable", auto_update = "24h" }
ruby = "3"
usage = { version = "latest", auto_update = true }
"cargo:xavier-cli" = "latest"

[settings.github]
credential_command = 'gh auth token --hostname "$MISE_CREDENTIAL_HOST"'

[bootstrap.repos]
"~/.oh-my-zsh" = { url = "https://github.com/ohmyzsh/ohmyzsh.git" }

[bootstrap.brew.taps]
"nikitabobko/tap" = "https://github.com/nikitabobko/homebrew-tap.git"

[dotfiles]
"~" = { source = "~/.dotfiles", mode = "symlink-each", manifest = "git", exclude = [
  ".config/**",
  "README.md",
  "LICENSE*",
  "COPYING",
  "lefthook.yml",
  ".lefthook",
  ".gitignore",
] }

# Link these app dirs as whole directories so symlink-each never walks through
# a link back into ~/.dotfiles.
"~/.config/aerospace" = {}
"~/.config/agent-browser" = {}
"~/.config/configstore" = {}
"~/.config/cron" = {}
"~/.config/ghostty" = {}
"~/.config/kanata" = {}
"~/.config/lazygit" = {}
"~/.config/linearmouse" = {}
"~/.config/nvim" = {}
"~/.config/opencode/AGENTS.md" = {}
"~/.config/opencode/agent" = {}
"~/.config/opencode/cli.json" = {}
"~/.config/opencode/opencode.json" = {}
"~/.config/opencode/plugins" = {}
"~/.config/opencode/skill" = {}
"~/.config/opencode/usage-limits.jsonc" = {}
"~/.config/scripts" = {}
"~/.config/starship" = {}
"~/.config/timewarrior" = {}
"~/.config/tmux" = {}

[bootstrap.packages]
"brew:bat" = "latest"
"brew:bottom" = "latest"
"brew:cloudflared" = "latest"
"brew:cmake" = "latest"
"brew:displayplacer" = { version = "latest", os = ["macos"] }
"brew:docker" = "latest"
"brew:docker-compose" = "latest"
"brew:doppler" = "latest"
"brew:fd" = "latest"
"brew:ffmpeg" = "latest"
"brew:fzf" = "latest"
"brew:fzf-tab" = "latest"
"brew:gdu" = "latest"
"brew:gh" = "latest"
"brew:git-delta" = "latest"
"brew:git-secrets" = "latest"
"brew:gnupg" = "latest"
"brew:himalaya" = "latest"
"brew:kanata" = "latest"
"brew:lazygit" = "latest"
"brew:lazysql" = "latest"
"brew:lefthook" = "latest"
"brew:librdkafka" = "latest"
"brew:llama.cpp" = "latest"
"brew:lua-language-server" = "latest"
"brew:mkcert" = "latest"
"brew:mole" = { version = "latest", os = ["macos"] }
"brew:fastfetch" = "latest"
"brew:neovim" = "latest"
"brew:ollama" = "latest"
"brew:pandoc" = "latest"
"brew:parallel" = "latest"
"brew:pass" = "latest"
"brew:pass-import" = "latest"
"brew:poppler" = "latest"
"brew:python@3.12" = "latest"
"brew:redis" = "latest"
"brew:ripgrep" = "latest"
"brew:sshpass" = "latest"
"brew:starship" = "latest"
"brew:summarize" = "latest"
"brew:timewarrior" = "latest"
"brew:tmux" = "latest"
"brew:tree-sitter-cli" = "latest"
"brew:typst" = "latest"
"brew:yazi" = "latest"
"brew:yq" = "latest"
"brew:yt-dlp" = "latest"
"brew:zsh-autosuggestions" = "latest"
"brew:zsh-completions" = "latest"
"brew:zsh-fast-syntax-highlighting" = "latest"

# GUI apps; adopt existing manual installs when identical
"brew-cask:nikitabobko/tap/aerospace" = { version = "latest", os = ["macos"], adopt = true }
"brew-cask:ghostty" = { version = "latest", os = ["macos"], adopt = true }

# Tap formulae still need Homebrew: they publish no api/formula metadata and
# several use Homebrew DSL that mise's evaluator does not implement (memo uses
# virtualenv_install_with_resources). Keep this hook until upstream publishes
# metadata or mise supports those formula features.
[bootstrap.hooks.post-packages]
run = """
set -e
# oh-my-zsh refuses completions from group-writable Homebrew dirs
if [ -d /opt/homebrew/share ]; then
  chmod g-w,o-w /opt/homebrew/share 2>/dev/null || true
fi
TAPS="anomalyco/tap steipete/tap gittower/tap antoniorodr/memo cirruslabs/cli nikitabobko/tap"
ALL_OS_TAPS="steipete/tap/gifgrep gittower/tap/git-flow-next antoniorodr/memo/memo anomalyco/tap/opencode-v2"
MACOS_ONLY_TAPS="steipete/tap/imsg steipete/tap/peekaboo steipete/tap/remindctl cirruslabs/cli/tart"
for tap in $TAPS; do
  brew tap "$tap" 2>/dev/null || true
done
brew trust $TAPS 2>/dev/null || true
tap_install() {
  if brew list "$1" &>/dev/null; then
    echo "TAP present: $1"
  elif brew install "$1"; then
    echo "TAP installed: $1"
  else
    echo "TAP FAILED (continuing): $1"
  fi
}
for formula in $ALL_OS_TAPS; do tap_install "$formula"; done
if [ "$(uname)" = "Darwin" ]; then
  for formula in $MACOS_ONLY_TAPS; do tap_install "$formula"; done
else
  echo "SKIP macOS-only tap formulae (on Linux)"
fi
"""

[tasks.bootstrap]
dir = "~/.dotfiles"
run = [
  "git remote get-url origin | grep -qx 'git@github.com:zeromask1337/.dotfiles.git' || git remote set-url origin git@github.com:zeromask1337/.dotfiles.git",
  "lefthook install || echo 'WARN lefthook install failed (continuing)'",
  "sh .config/cron/install.sh || echo 'WARN crontab install failed (continuing)'",
]

[bootstrap.services.opencode-server]
scope = "user"
command = "/opt/homebrew/bin/doppler run -- /opt/homebrew/bin/opencode serve --hostname 127.0.0.1 --port 4096"
working_directory = "~"
environment = { PATH = "/opt/homebrew/bin:/usr/local/bin:/usr/bin:/bin:/usr/sbin:/sbin" }
restart = "on-failure"
requires_tools = true
