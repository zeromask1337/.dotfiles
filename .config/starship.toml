# Get editor completions based on the config schema
"$schema" = 'https://starship.rs/config-schema.json'

# Inserts a blank line between shell prompts
add_newline = true

# Prompt layout: repo context on line 1, burger on line 2.
# git_metrics gives real added/removed line counts; git_status is stripped down
# to ahead/behind counters only (no status glyph soup).
format = '$directory$git_branch$git_metrics$git_state$git_status$status$line_break$character'

[character]
success_symbol = '[🍔](bold green)'
error_symbol = '[🤮](bold red)'

[git_metrics]
disabled = false
format = '([+$added]($added_style) )([-$deleted]($deleted_style) )'
added_style = 'bold green'
deleted_style = 'bold red'
only_nonzero_diffs = true

# Disable the package module, hiding it from the prompt completely
[package]
disabled = true

# Git operation state (merging/rebase/bisect) and ahead/behind counters.
# Each block carries its own "◇" prefix so the divider only appears when the
# block has something to say — no dangling separator in a clean, synced repo.
[git_state]
format = '([◇ ](bright-black)[\($state( $progress_current/$progress_total)\)]($style) )'

[git_status]
format = '([◇ ](bright-black)[$ahead_behind]($style) )'
ahead = '⇡${count}'
behind = '⇣${count}'
diverged = '⇕⇡${ahead_count}⇣${behind_count}'
